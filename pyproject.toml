[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-intelligence"
version = "0.1.0"
description = "个人 BTC 行情采集与分析系统（M1）"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "websockets>=15,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
btc-intelligence = "btc_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
